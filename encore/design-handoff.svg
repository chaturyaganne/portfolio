<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320"><defs><style>text{font-family:Arial,sans-serif;fill:#18352c}.serif{font-family:Georgia,serif}.small{font-size:13px}.body{font-size:16px}.caps{font-size:11px;letter-spacing:2px}.muted{fill:#52665c}.white{fill:#fffef9}</style></defs><rect width="1440" height="1320" fill="#f6f5ed"/><text x="60" y="65" font-size="38" class="serif">Encore / Design handoff</text><text x="60" y="98" class="body muted">Chaturya Ganne · Independent UX concept · Editable SVG, not a native Figma file</text><text x="60" y="127" class="small muted">Fictional events, inventory and prices. No interviews or participant usability study conducted.</text><g transform="translate(60 175)"><rect width="420" height="680" rx="8" fill="#fffef9" stroke="#ced4c7"/><text x="24" y="42" font-size="27" font-weight="bold">encore✳</text><line x1="24" y1="65" x2="396" y2="65" stroke="#ced4c7"/><text x="24" y="101" class="caps">01 / DISCOVER</text><text x="24" y="145" font-size="32" class="serif">Good nights start here.</text><rect x="24" y="173" width="372" height="88" rx="4" fill="#edf1e4"/><text x="40" y="198" class="small">People going</text><text x="190" y="198" class="small">Budget per person, all-in</text><rect x="40" y="211" width="110" height="32" fill="#fffef9" stroke="#9bad9b"/><text x="50" y="233" class="small">4 people</text><rect x="190" y="211" width="185" height="32" fill="#fffef9" stroke="#9bad9b"/><text x="203" y="233" class="small">$100</text><rect x="24" y="285" width="372" height="176" fill="#304b39"/><circle cx="334" cy="365" r="82" fill="none" stroke="#deff83" stroke-width="22" opacity=".35"/><text x="48" y="320" class="caps white">MUSIC / LIVE IN NEW YORK</text><text x="48" y="375" font-size="43" class="serif white">Midnight</text><text x="48" y="419" font-size="43" class="serif white">Echo</text><text x="24" y="492" class="small muted">MAY 14, 2027 · HARBOR HALL</text><text x="24" y="534" font-size="23"