lass="body">Midnight Echo</text><text x="24" y="219" class="small muted">Section 102 · Row B · 4 adjacent seats</text><text x="24" y="247" class="small muted">Step-free route · Clear view</text><rect x="24" y="279" width="372" height="214" fill="#f6f5ed" stroke="#ced4c7"/><text x="42" y="316" class="body">Tickets (4 × $64)</text><text x="331" y="316" class="body">$256</text><text x="42" y="352" class="body">Fees (4 × $16)</text><text x="340" y="352" class="body">$64</text><text x="42" y="388" class="body">Per person, all-in</text><text x="340" y="388" class="body">$80</text><line x1="42" y1="411" x2="378" y2="411" stroke="#ced4c7"/><text x="42" y="455" font-size="23">Group total</text><text x="314" y="455" font-size="23">$320</text><text x="24" y="531" class="small muted">No reservation, purchase or payment.</text><text x="24" y="555" class="small muted">Wheelchair space is not confirmed.</text><rect x="24" y="590" width="372" height="48" rx="4" fill="#18352c"/><text x="135" y="620" class="body white">Copy group plan</text></g><text x="60" y="920" font-size="30" class="serif">Tokens &amp; principles</text><g transform="translate(60 950)"><rect width="100" height="70" fill="#f6f5ed" stroke="#ced4c7"/><rect x="120" width="100" height="70" fill="#18352c"/><rect x="240" width="100" height="70" fill="#deff83"/><rect x="360" width="100" height="70" fill="#a53f25"/><text x="0" y="98" class="small">#F6F5ED</text><text x="120" y="98" class="small">#18352C</text><text x="240" y="98" class="small">#DEFF83</text><text x="360" y="98" class="small">#A53F25</text></g><text x="620" y="978" class="body">DM Serif Display / DM Sans (Georgia / Arial fallbacks)</text><text x="620" y="1010" class="body">Price in integer cents. Group needs persist in the tab.</text><text x="620" y="1042" class="body">Clear labels. Visible focus. List alternative to the map.</text><text x="60" y="1125" font-size="26" class="serif">A plan for learning, not a claim of validated success.</text><text x="60" y="1162" class="body muted">Import this sheet into Figma to continue iteration. See design-spec.md for data contracts,</text><text x="60" y="1190" class="body muted">component states and responsive rules, and research-kit.md for the proposed participant study.</text><text x="60" y="1260" class="small muted">Independent concept · AI-assisted implementation · Chaturya Ganne · 2026</text></svg>
